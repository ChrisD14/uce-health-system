name: Auth Service QA

on:
  push:
    branches:
      - qa

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build

        run: |

          cd services/auth-service

          mvn clean verify

      - name: Build Docker

        run: |

          cd services/auth-service

          docker build -t auth-service .