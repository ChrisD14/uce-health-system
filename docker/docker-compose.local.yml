services:

  postgres-auth:

    image: postgres:16

    container_name: postgres-auth

    restart: unless-stopped

    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin

    ports:
      - "5433:5432"

    volumes:
      - auth_postgres_data:/var/lib/postgresql/data

  auth-service:

    build:
      context: ../services/auth-service

    container_name: auth-service

    depends_on:
      - postgres-auth

    ports:
      - "8081:8081"

volumes:
  auth_postgres_data: