services:

  postgres-auth:

    image: postgres:16

    container_name: postgres-auth

    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin

    ports:
      - "5433:5432"

  postgres-user:

    image: postgres:16

    container_name: postgres-user

    environment:
      POSTGRES_DB: userdb
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin

    ports:
      - "5434:5432"

  auth-service:

    build:
      context: ../services/auth-service

    container_name: auth-service

    environment:
      DB_URL: jdbc:postgresql://postgres-auth:5432/authdb
      DB_USER: admin
      DB_PASSWORD: admin
      JWT_SECRET: UceHealthSystemQaJwtSecret2026

    ports:
      - "8081:8081"

    depends_on:
      - postgres-auth

  user-service:

    build:
      context: ../services/user-service

    container_name: user-service

    environment:
      DB_URL: jdbc:postgresql://postgres-user:5432/userdb
      DB_USER: admin
      DB_PASSWORD: admin

    ports:
      - "8082:8082"

    depends_on:
      - postgres-user

  frontend:

    build:
      context: ../frontend/auth-ui

    container_name: frontend

    ports:
      - "80:80"

    depends_on:
      - auth-service
      - user-service