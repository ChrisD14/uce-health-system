services:

  postgres-auth:

    image: postgres:16

    container_name: postgres-auth

    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin

    ports:
      - "5433:5432"

  postgres-user:

    image: postgres:16

    container_name: postgres-user

    environment:
      POSTGRES_DB: userdb
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin

    ports:
      - "5434:5432"

  auth-service:

    image: docker-auth-service:latest

    container_name: auth-service

    environment:
      DB_URL: jdbc:postgresql://postgres-auth:5432/authdb
      DB_USER: admin
      DB_PASSWORD: admin
      JWT_SECRET: TU_SECRET_JWT

    ports:
      - "8081:8081"

    depends_on:
      - postgres-auth

  user-service:

    image: user-service:latest

    container_name: user-service

    environment:
      DB_URL: jdbc:postgresql://postgres-user:5432/userdb
      DB_USER: admin
      DB_PASSWORD: admin

    ports:
      - "8082:8082"

    depends_on:
      - postgres-user

  frontend:
